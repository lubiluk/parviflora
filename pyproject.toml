[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parviflora"
version = "0.1.0"
description = "RL"
authors = [{ name = "Paul Gajewski" }]
requires-python = ">=3.11"
dependencies = [
    "gymnasium",
    "numpy",
    "torch",
    "tqdm",
    "tensorboard",
    "wandb",
    "gymnasium-robotics>=1.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["parviflora"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

